name: Publish website to gh-pages

# 官网发布：只要 image-extractor/docs 有变化，就把该目录同步到 gh-pages 分支
# GitHub Pages 的 Source 为「Deploy from a branch → gh-pages → / (root)」
on:
  push:
    branches: [main, master]
    paths:
      - "image-extractor/docs/**"
      - ".github/workflows/pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish docs to gh-pages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 直接用 docs 目录的 tree 作为 gh-pages 的根目录，不产生工作区改动
          tree=$(git rev-parse HEAD:image-extractor/docs)
          commit=$(git commit-tree "$tree" -m "deploy: publish website from ${GITHUB_SHA::7}")
          git push --force origin "$commit:refs/heads/gh-pages"

          echo "已发布到 gh-pages：$commit"
