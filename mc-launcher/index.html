<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="镜界：Windows 上的 Minecraft 启动器界面演示。演示数据、假进度，覆盖纯净版、Mod、整合包、材质包与光影。">
  <title>镜界 · Minecraft 启动器（界面演示）</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23151a22'/%3E%3Cpath d='M12 4.2 19.4 8.4v7.2L12 19.8 4.6 15.6V8.4z' fill='none' stroke='%2355d98d' stroke-width='1.4'/%3E%3Cpath d='M4.6 8.4 12 12.6l7.4-4.2M12 12.6v7.2' fill='none' stroke='%2355d98d' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip-link" href="#view">跳到主内容</a>

  <div class="window">
    <header class="titlebar">
      <div class="titlebar__brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 2.8 20 7.4v9.2L12 21.2 4 16.6V7.4z"></path>
            <path d="M4 7.4 12 12l8-4.6M12 12v9.2"></path>
          </svg>
        </span>
        <span class="brand__name">镜界</span>
        <span class="brand__sub">Jingjie Launcher</span>
        <span class="chip chip--demo">演示数据</span>
      </div>
      <div class="titlebar__meta" id="titlebar-meta">仅 Windows · 纯净版 + 内容 · 假进度</div>
      <div class="titlebar__controls">
        <button class="winbtn" type="button" aria-label="最小化（演示版不可用）" disabled>
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" fill="none" stroke="currentColor" stroke-width="1.2"></path></svg>
        </button>
        <button class="winbtn" type="button" aria-label="最大化（演示版不可用）" disabled>
          <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2"></rect></svg>
        </button>
        <button class="winbtn winbtn--close" type="button" aria-label="关闭（演示版不可用）" disabled>
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" fill="none" stroke="currentColor" stroke-width="1.2"></path></svg>
        </button>
      </div>
    </header>

    <div class="shell">
      <nav class="nav" aria-label="主导航">
        <ul class="nav__list">
          <li>
            <button class="nav__item" type="button" data-route="home">
              <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <path d="M4 11.2 12 4l8 7.2V20h-5.4v-5.2H9.4V20H4z"></path>
              </svg>
              <span>主页</span>
            </button>
          </li>
          <li class="nav__group" id="nav-download" data-open="true">
            <button class="nav__item nav__item--group" type="button" data-action="nav:toggle" aria-expanded="true" aria-controls="nav-download-sub">
              <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <path d="M12 4v10.4M8.2 10.8 12 14.6l3.8-3.8"></path>
                <path d="M4.4 16.6v2.2a1.6 1.6 0 0 0 1.6 1.6h12a1.6 1.6 0 0 0 1.6-1.6v-2.2"></path>
              </svg>
              <span class="nav__label">下载</span>
              <svg class="nav__chev" viewBox="0 0 12 12" aria-hidden="true">
                <path d="M3 4.6 6 7.6l3-3" fill="none" stroke="currentColor" stroke-width="1.4"></path>
              </svg>
            </button>
            <ul class="nav__sub" id="nav-download-sub">
              <li><button class="nav__subitem" type="button" data-route="versions">纯净版</button></li>
              <li><button class="nav__subitem" type="button" data-route="mods">Mod</button></li>
              <li><button class="nav__subitem" type="button" data-route="modpacks">整合包</button></li>
              <li><button class="nav__subitem" type="button" data-route="resourcepacks">材质包</button></li>
              <li><button class="nav__subitem" type="button" data-route="shaders">光影</button></li>
            </ul>
          </li>
          <li>
            <button class="nav__item" type="button" data-route="instances">
              <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <rect x="3.6" y="3.6" width="7" height="7" rx="1.4"></rect>
                <rect x="13.4" y="3.6" width="7" height="7" rx="1.4"></rect>
                <rect x="3.6" y="13.4" width="7" height="7" rx="1.4"></rect>
                <rect x="13.4" y="13.4" width="7" height="7" rx="1.4"></rect>
              </svg>
              <span>实例</span>
            </button>
          </li>
          <li>
            <button class="nav__item" type="button" data-route="logs">
              <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <rect x="3.4" y="4.4" width="17.2" height="15.2" rx="2.2"></rect>
                <path d="M7.4 9.4 10.6 12l-3.2 2.6M12.4 15h4"></path>
              </svg>
              <span>日志与诊断</span>
            </button>
          </li>
          <li>
            <button class="nav__item" type="button" data-route="settings">
              <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
                <circle cx="12" cy="12" r="3.1"></circle>
                <path d="M12 3.6v2M12 18.4v2M4.6 12h2M17.4 12h2M6.8 6.8l1.4 1.4M15.8 15.8l1.4 1.4M17.2 6.8l-1.4 1.4M8.2 15.8l-1.4 1.4"></path>
              </svg>
              <span>设置</span>
            </button>
          </li>
        </ul>

        <div class="nav__aside">
          <button class="mirror-pill" type="button" data-action="mirror:test" id="mirror-pill">
            <span class="mirror-pill__dot" aria-hidden="true"></span>
            <span class="mirror-pill__text">
              <span class="mirror-pill__title" id="mirror-pill-title">BMCLAPI 镜像</span>
              <span class="mirror-pill__sub" id="mirror-pill-sub">38 ms · 11.4 MB/s</span>
            </span>
            <span class="mirror-pill__action">测速</span>
          </button>
          <button class="account-card" type="button" data-action="account:open">
            <span class="avatar" aria-hidden="true">M</span>
            <span class="account-card__text">
              <span class="account-card__name" id="account-name">Mirror_Walker</span>
              <span class="account-card__tag" id="account-tag">离线账号</span>
            </span>
            <span class="account-card__chev" aria-hidden="true">›</span>
          </button>
        </div>
      </nav>

      <main class="main" id="view" tabindex="-1"></main>
    </div>

    <footer class="statusbar">
      <span class="statusbar__demo"><span class="dot" aria-hidden="true"></span>演示数据 · 不会真正下载或启动游戏</span>
      <span class="statusbar__spacer"></span>
      <span id="status-installed">已安装 3 个实例 · 3 项内容</span>
      <span id="status-processes">模拟进程 0</span>
      <span id="status-scenario">场景：正常网络</span>
    </footer>
  </div>

  <button class="taskball" type="button" id="taskball" data-action="taskpop:toggle" aria-expanded="false" aria-controls="taskpop" aria-label="打开安装任务面板">
    <span class="taskball__ring" aria-hidden="true"></span>
    <span class="taskball__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 4.6v9.6M8.6 10.8 12 14.2l3.4-3.4"></path>
        <path d="M5 15.4v2.4a1.8 1.8 0 0 0 1.8 1.8h10.4a1.8 1.8 0 0 0 1.8-1.8v-2.4"></path>
      </svg>
    </span>
    <span class="taskball__badge" id="taskball-badge" hidden>0</span>
  </button>

  <aside class="taskpop" id="taskpop" aria-label="安装任务" hidden>
    <header class="taskpop__head">
      <h2 class="taskpop__title">安装任务</h2>
      <span class="taskpop__meta" id="taskpop-meta">队列空闲</span>
      <button class="iconbtn" type="button" data-action="taskpop:close" aria-label="关闭安装任务面板">✕</button>
    </header>
    <div class="taskpop__body" id="taskpop-body"></div>
    <footer class="taskpop__foot">
      <p class="taskpop__label">去下载</p>
      <div class="taskpop__links">
        <button class="taskpop__link" type="button" data-route="versions">纯净版</button>
        <button class="taskpop__link" type="button" data-route="mods">Mod</button>
        <button class="taskpop__link" type="button" data-route="modpacks">整合包</button>
        <button class="taskpop__link" type="button" data-route="resourcepacks">材质包</button>
        <button class="taskpop__link" type="button" data-route="shaders">光影</button>
      </div>
      <button class="linkbtn" type="button" data-route="downloads">打开完整安装任务页</button>
    </footer>
  </aside>

  <button class="devbtn" type="button" id="devbtn" aria-expanded="false" aria-controls="devpanel">
    <span aria-hidden="true">◐</span> 演示场景
  </button>

  <aside class="devpanel" id="devpanel" aria-label="演示场景切换" hidden>
    <div class="devpanel__head">
      <h2>演示场景</h2>
      <button class="iconbtn" type="button" data-action="dev:close" aria-label="关闭演示场景面板">✕</button>
    </div>
    <p class="devpanel__hint">切换后立刻生效，用来复现 PRD 第 7 节的六种状态。</p>
    <div class="devpanel__list" id="devpanel-list"></div>
    <button class="btn btn--danger btn--block" type="button" data-action="dev:reset">重置演示数据</button>
  </aside>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="modal" id="modal" hidden>
    <div class="modal__scrim" data-close="1"></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <header class="modal__head">
        <h2 id="modal-title">标题</h2>
        <button class="iconbtn" type="button" data-action="modal:close" aria-label="关闭对话框">✕</button>
      </header>
      <div class="modal__body" id="modal-body"></div>
      <footer class="modal__foot" id="modal-foot"></footer>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
