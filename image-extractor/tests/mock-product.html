<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模拟商品详情页 · 悬浮按钮预览</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f4f4;
        color: #1f2329;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      .notice {
        background: #1f2937;
        color: #e5e7eb;
        font-size: 12px;
        text-align: center;
        padding: 8px 12px;
      }
      .notice b {
        color: #fff;
      }
      .topbar {
        background: #fff;
        border-bottom: 1px solid #ebebeb;
      }
      .topbar__inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .logo {
        font-size: 18px;
        font-weight: 700;
        color: #ff5000;
        letter-spacing: 0.02em;
      }
      .search {
        flex: 1;
        max-width: 520px;
        height: 34px;
        border: 2px solid #ff5000;
        border-radius: 4px 18px 18px 4px;
        display: flex;
        align-items: center;
        padding: 0 4px 0 12px;
        color: #9ca3af;
        font-size: 13px;
      }
      .search__btn {
        margin-left: auto;
        padding: 4px 16px;
        border-radius: 14px;
        background: #ff5000;
        color: #fff;
        font-size: 13px;
      }
      .crumb {
        max-width: 1200px;
        margin: 0 auto;
        padding: 12px 24px 0;
        font-size: 12px;
        color: #6b7280;
      }
      .main {
        max-width: 1200px;
        margin: 12px auto 40px;
        background: #fff;
        border-radius: 8px;
        padding: 24px;
        display: grid;
        grid-template-columns: 420px minmax(0, 1fr);
        gap: 32px;
      }
      .gallery__main {
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid #f0f0f0;
        border-radius: 6px;
        overflow: hidden;
        background: #fafafa;
      }
      .gallery__main img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .thumbs {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .thumbs img {
        width: 64px;
        height: 64px;
        border-radius: 4px;
        border: 1px solid #ebebeb;
        object-fit: cover;
        cursor: pointer;
      }
      .thumbs img.active {
        border-color: #ff5000;
      }
      .info h1 {
        margin: 0 0 12px;
        font-size: 20px;
        line-height: 1.4;
        font-weight: 600;
      }
      .price-box {
        background: #fff5f0;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 18px;
      }
      .price {
        color: #ff5000;
        font-size: 28px;
        font-weight: 700;
      }
      .price small {
        font-size: 14px;
        font-weight: 400;
      }
      .price-meta {
        color: #9ca3af;
        font-size: 12px;
        margin-top: 4px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 14px;
        font-size: 13px;
      }
      .row__label {
        width: 56px;
        color: #6b7280;
        flex: 0 0 56px;
      }
      .chip {
        padding: 4px 12px;
        border: 1px solid #e5e7eb;
        border-radius: 4px;
        background: #fafafa;
        cursor: pointer;
      }
      .chip.active {
        border-color: #ff5000;
        color: #ff5000;
        background: #fff5f0;
      }
      .buy {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }
      .buy button {
        height: 44px;
        padding: 0 40px;
        border: 0;
        border-radius: 4px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
      }
      .buy .cart {
        background: #ff9500;
      }
      .buy .now {
        background: #ff5000;
      }
      .detail {
        max-width: 1200px;
        margin: 0 auto 80px;
        background: #fff;
        border-radius: 8px;
        padding: 24px;
      }
      .detail h2 {
        font-size: 15px;
        margin: 0 0 16px;
        color: #374151;
      }
      .detail img {
        width: 100%;
        max-width: 700px;
        display: block;
        margin: 0 auto 12px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="notice">
      这是本地模拟页面，用于预览插件右下角按钮与面板样式，<b>不是真实电商网站</b>。
      真实插件只在商品详情页显示按钮。
    </div>

    <div class="topbar">
      <div class="topbar__inner">
        <div class="logo">云栖生活</div>
        <div class="search">北欧风陶瓷马克杯 大容量 <span class="search__btn">搜索</span></div>
      </div>
    </div>

    <div class="crumb">首页 › 家居日用 › 杯具 › 北欧风陶瓷马克杯</div>

    <div class="main">
      <div class="gallery">
        <div class="gallery__main">
          <img id="main-img" src="../extension/demo/02.png" alt="商品主图" />
        </div>
        <div class="thumbs" id="thumbs">
          <img class="active" src="../extension/demo/02.png" alt="" />
          <img src="../extension/demo/01.png" alt="" />
          <img src="../extension/demo/05.png" alt="" />
          <img src="../extension/demo/09.png" alt="" />
          <img src="../extension/demo/10.png" alt="" />
        </div>
      </div>

      <div class="info">
        <h1>北欧风陶瓷马克杯 400ml 大容量 办公室水杯 简约哑光釉面</h1>
        <div class="price-box">
          <div class="price"><small>¥</small>69.00</div>
          <div class="price-meta">月销 2000+ · 累计评价 862 · 店铺好评率 99.2%</div>
        </div>
        <div class="row">
          <span class="row__label">颜色</span>
          <span class="chip active">燕麦白</span>
          <span class="chip">雾霾蓝</span>
          <span class="chip">赤陶棕</span>
        </div>
        <div class="row">
          <span class="row__label">数量</span>
          <span class="chip active">1 件</span>
        </div>
        <div class="buy">
          <button class="cart" type="button">加入购物车</button>
          <button class="now" type="button">立即购买</button>
        </div>
      </div>
    </div>

    <div class="detail">
      <h2>商品详情</h2>
      <img src="../extension/demo/05.png" alt="" />
      <img src="../extension/demo/06.png" alt="" />
    </div>

    <script>
      /* 复刻 content.js 的 DOM 结构，用来验证 content.css 的实际渲染效果 */
      (function () {
        var host = document.createElement('div');
        host.setAttribute('data-imgx-host', '1');
        host.style.cssText =
          'all:initial;position:fixed;inset:0;pointer-events:none;z-index:2147483000;';
        var shadow = host.attachShadow({ mode: 'open' });

        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '../extension/content.css';
        shadow.appendChild(link);

        var root = document.createElement('div');
        root.className = 'imgx-root';
        root.innerHTML =
          '<button class="imgx-btn" type="button">' +
          '<svg class="imgx-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="3" x2="12" y2="15"/></svg>' +
          '<span class="imgx-btn__label">获取图片</span>' +
          '</button>' +
          '<div class="imgx-panel" hidden>' +
          '<button class="imgx-panel__close" type="button">×</button>' +
          '<div class="imgx-panel__meta"><span class="imgx-panel__count">12</span><span class="imgx-panel__label">张图片</span></div>' +
          '<p class="imgx-panel__hint">已在新标签页打开图库，勾选后可批量下载为 PNG。</p>' +
          '<div class="imgx-panel__actions">' +
          '<button class="imgx-panel__open" type="button">打开图库</button>' +
          '<button class="imgx-panel__again" type="button">重新扫描</button>' +
          '</div>' +
          '</div>';

        shadow.appendChild(root);
        document.documentElement.appendChild(host);

        var btn = shadow.querySelector('.imgx-btn');
        var label = shadow.querySelector('.imgx-btn__label');
        var panel = shadow.querySelector('.imgx-panel');

        btn.addEventListener('click', function () {
          // 模拟扫描过程：忙碌 1.2 秒后弹出结果面板
          btn.dataset.busy = 'true';
          label.textContent = '扫描中…';
          setTimeout(function () {
            btn.dataset.busy = 'false';
            label.textContent = '获取图片';
            panel.hidden = false;
          }, 1200);
        });

        shadow.querySelector('.imgx-panel__close').addEventListener('click', function () {
          panel.hidden = true;
        });
        shadow.querySelector('.imgx-panel__open').addEventListener('click', function () {
          location.href = '../extension/gallery.html';
        });
        shadow.querySelector('.imgx-panel__again').addEventListener('click', function () {
          panel.hidden = true;
        });

        // 缩略图切换
        var main = document.getElementById('main-img');
        Array.from(document.querySelectorAll('#thumbs img')).forEach(function (thumb) {
          thumb.addEventListener('click', function () {
            document.querySelectorAll('#thumbs img').forEach(function (t) {
              t.classList.remove('active');
            });
            thumb.classList.add('active');
            main.src = thumb.src;
          });
        });
      })();
    </script>
  </body>
</html>
