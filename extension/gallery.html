<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品图片 · 提取结果</title>
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__row">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <circle cx="8.5" cy="8.5" r="1.5" />
              <path d="m21 15-4.5-4.5L6 21" />
            </svg>
          </span>
          <div class="brand__text">
            <h1 class="brand__title">商品图片提取结果</h1>
            <p class="brand__meta" id="page-meta">正在读取扫描结果…</p>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="stat__value" id="stat-total">0</span>
            <span class="stat__label">提取到</span>
          </div>
          <div class="stat stat--accent">
            <span class="stat__value" id="stat-selected">0</span>
            <span class="stat__label">已选择</span>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <div class="toolbar__group">
          <button type="button" class="btn" id="btn-all">全选</button>
          <button type="button" class="btn" id="btn-invert">反选</button>
          <button type="button" class="btn" id="btn-none">清空</button>
        </div>

        <label class="switch" title="关闭后，未标注尺寸的小图也会显示出来">
          <input type="checkbox" id="filter-small" checked />
          <span>仅保留 ≥ 100×100</span>
        </label>

        <span class="toolbar__spacer"></span>

        <span class="toolbar__hint" id="selection-hint">勾选图片后下载</span>
        <button type="button" class="btn btn--primary" id="btn-download" disabled>
          下载选中为 PNG
        </button>
      </div>
    </header>

    <main class="main">
      <div class="grid" id="grid"></div>

      <div class="empty" id="empty" hidden>
        <div class="empty__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <path d="m21 15-4.5-4.5L6 21" />
          </svg>
        </div>
        <h2 class="empty__title">还没有可展示的图片</h2>
        <p class="empty__text" id="empty-text">
          回到商品详情页，点击右下角的「获取图片」按钮重新扫描。
        </p>
      </div>
    </main>

    <footer class="progress" id="progress" hidden>
      <div class="progress__text" id="progress-text">准备下载…</div>
      <div class="progress__track">
        <div class="progress__fill" id="progress-fill"></div>
      </div>
    </footer>

    <div class="toast" id="toast" hidden></div>

    <script src="lib/image-utils.js"></script>
    <script src="gallery.js"></script>
  </body>
</html>
